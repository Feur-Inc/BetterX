name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build all
        run: bun run build

      - name: Build Android web bundle
        run: bun run --cwd packages/android build:web

      - name: Build Android APK
        run: ./gradlew assembleDebug
        working-directory: packages/android

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: packages/extension/dist/
          retention-days: 14

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ github.sha }}
          path: packages/desktop/dist/
          retention-days: 14

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun run build

      - name: Package extension (zip)
        run: |
          cd packages/extension/dist
          zip -r ../../../betterx-extension.zip .

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: packages/desktop

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "BetterX V3 v${{ steps.version.outputs.version }}"
          files: |
            betterx-extension.zip
          body: |
            ## BetterX V3 v${{ steps.version.outputs.version }}

            ### Installation
            - **Browser Extension**: Download `betterx-extension.zip`, unzip, load as unpacked extension in Chrome
            - **Desktop App**: Coming soon

            ### Changes
            See commit history for details.
